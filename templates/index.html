<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل اللسان القرآني</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .quran-text { font-family: 'Amiri', 'Traditional Arabic', serif; font-size: 1.25rem; }
        .editable { background-color: #ffffff; cursor: pointer; transition: background-color 0.2s; }
        .editable:hover, .editable:focus { background-color: #fff3cd !important; outline: none; }

        .search-group-rtl .form-select {
            max-width: 180px;
            border-top-left-radius: 0 !important;
            border-bottom-left-radius: 0 !important;
            border-top-right-radius: 0.5rem !important;
            border-bottom-right-radius: 0.5rem !important;
        }

        .search-group-rtl .form-control {
            border-radius: 0 !important;
        }

        .search-group-rtl .search-btn-rtl {
            border-top-right-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
            border-top-left-radius: 0.5rem !important;
            border-bottom-left-radius: 0 !important;
        }

        .topic-tag {
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease-in-out;
            font-size: 0.85rem;
            padding: 0.4em 0.75em;
        }
        .topic-tag.active {
            background-color: #0d6efd !important;
            color: #fff !important;
        }
        .topic-tag.inactive {
            background-color: #e9ecef !important;
            color: #495057 !important;
            border: 1px solid #ced4da;
        }

        details.ayah-details summary { 
            list-style: none; 
            cursor: pointer; 
            user-select: none;
        }
        details.ayah-details summary::-webkit-details-marker { display: none; }
        
        .toggle-icon::before { content: "▼"; display: inline-block; transition: transform 0.2s; margin-left: 8px; font-size: 0.8rem; }
        details[open] .toggle-icon::before { transform: rotate(-180deg); }

        .nav-arrow-btn {
            min-width: 42px;
            font-weight: bold;
        }
        
        .note-item {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body class="container py-4">

    <!-- Header & Search Controls -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>البحث في القرآني</h2>
        <a href="/topics" class="btn btn-outline-secondary">إدارة المواضيع ⚙️</a>
    </div>
    <div class="row mb-4">
        <div class="col-12">
            <div class="input-group input-group-lg search-group-rtl">
                <select id="search-column" class="form-select custom-select-rtl">
                    <option value="word_text">الكلمة</option>
                    <option value="source_word">الجذر / المصدر</option>
                    <option value="meaning">المعنى</option>
                    <option value="topic">الموضوع</option>
                    <option value="full_text" selected>نص الآية</option>
                </select>
                <input type="text" id="search-query" class="form-control" placeholder="أدخل كلمة البحث..." onkeydown="if(event.key === 'Enter') doSearch()">
                <button class="btn btn-primary px-4 search-btn-rtl" onclick="doSearch()">بحث</button>
            </div>
        </div>
    </div>

    <div id="results-container"></div>

    <script>
        let allTopics = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadTopics();
            
            const urlParams = new URLSearchParams(window.location.search);
            const col = urlParams.get('column');
            const q = urlParams.get('query');

            if (col && q) {
                document.getElementById('search-column').value = col;
                document.getElementById('search-query').value = q;
                doSearch();
            }
        });

        async function loadTopics() {
            const res = await fetch('/api/topics');
            allTopics = await res.json();
        }

        async function doSearch() {
            const col = document.getElementById('search-column').value;
            const q = document.getElementById('search-query').value;
            if(!q) return;

            const container = document.getElementById('results-container');
            container.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';

            const res = await fetch(`/api/search?column=${col}&query=${encodeURIComponent(q)}`);
            const data = await res.json();

            if(!data.results || data.results.length === 0) {
                container.innerHTML = '<div class="alert alert-warning text-center">لم يتم العثور على نتائج.</div>';
                return;
            }

            const total = data.total_found;
            const shown = data.results.length;
            
            let statsMessage = `تم العثور على <strong>${total}</strong> نتيجة`;
            if (total > shown) {
                statsMessage += ` (يتم عرض أول <strong>${shown}</strong> نتيجة فقط)`;
            }

            const statsHtml = `
                <div class="alert alert-info d-flex justify-content-between align-items-center mb-3 py-2">
                    <div>📊 ${statsMessage}</div>
                </div>
            `;

            container.innerHTML = statsHtml + data.results.map(r => renderAyahCard(r)).join('');
        }

        function renderAyahCard(r) {
            const topicTags = allTopics.map(t => {
                const isAssigned = r.assigned_topic_ids.includes(t.id);
                const statusClass = isAssigned ? 'active' : 'inactive';
                return `
                    <span class="badge rounded-pill topic-tag ${statusClass} me-1 mb-1" 
                          data-topic-id="${t.id}"
                          onclick="toggleAyahTopic(${r.surah}, ${r.ayah}, ${t.id}, this)">
                        ${t.name}
                    </span>
                `;
            }).join('');

            const notesList = (r.notes || []).map(n => `
                <li class="list-group-item d-flex justify-content-between align-items-start bg-white" id="note-item-${n.id}">
                    <div class="note-item me-2 text-wrap">${n.note_text}</div>
                    <button class="btn btn-sm btn-outline-danger py-0 px-2 ms-2" onclick="deleteNote(${n.id})">حذف</button>
                </li>
            `).join('');

            // Bi-directional Custom Links rendering
            const customLinksHtml = (r.custom_links || []).map(link => `
                <div class="p-2 border-bottom bg-white rounded mb-2 d-flex flex-wrap justify-content-between align-items-center" id="custom-link-${link.link_id}">
                    <div>
                        <span class="badge bg-dark me-1">${link.linked_surah_name || 'سورة'} [${link.linked_surah}:${link.linked_ayah}]</span>
                        <span class="quran-text me-2">${link.linked_text}</span>
                        ${link.link_comment ? `<div class="text-muted small mt-1">💡 <em>${link.link_comment}</em></div>` : ''}
                    </div>
                    <button class="btn btn-sm btn-outline-danger py-0 px-2 ms-2" onclick="deleteCustomLink(${link.link_id}, ${r.surah}, ${r.ayah})">حذف الربط</button>
                </div>
            `).join('');

            const relatedAyahsHtml = (r.related_ayahs || []).map(rel => {
                const relTopicBadges = (rel.topics && rel.topics.length > 0) 
                    ? rel.topics.map(tName => `<span class="badge bg-secondary ms-1">${tName}</span>`).join('')
                    : '<span class="badge bg-light text-dark ms-1">بدون موضوع</span>';

                return `
                    <div class="p-2 border-bottom bg-white rounded mb-1 d-flex flex-wrap justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-primary me-2">آية ${rel.ayah}</span>
                            <span class="quran-text">${rel.full_text}</span>
                        </div>
                        <div class="mt-1 mt-md-0">
                            ${relTopicBadges}
                        </div>
                    </div>
                `;
            }).join('');

            const rows = r.words.map(w => `
                <tr>
                    <td class="text-muted small">${w.word_num}</td>
                    <td class="quran-text fw-bold">${w.word_text}</td>
                    <td class="editable" contenteditable="true" onblur="updateWordField(${w.id}, 'source_word', this)">${w.source_word || ''}</td>
                    <td class="editable" contenteditable="true" onblur="updateWordField(${w.id}, 'wazn', this)">${w.wazn || ''}</td>
                    <td class="editable" contenteditable="true" onblur="updateWordField(${w.id}, 'meaning', this)">${w.meaning || ''}</td>
                </tr>
            `).join('');

            return `
                <div class="card mb-3 shadow-sm" id="ayah-card-${r.surah}-${r.ayah}">
                    <details class="ayah-details">
                        <summary class="card-header bg-light d-flex justify-content-between align-items-center py-3">
                            <div>
                                <span class="toggle-icon text-muted"></span>
                                <strong class="text-primary fs-5">${r.surah_name} [${r.surah}:${r.ayah}]</strong>
                                <span class="quran-text ms-3">${r.full_text}</span>
                            </div>
                        </summary>
                        
                        <div class="card-body">
                            <!-- Plain Text Row -->
                            <div class="alert alert-light border mb-3 py-2 text-dark">
                                <strong class="text-secondary small d-block mb-1">النص المبسط (بدون تشكيل):</strong>
                                <span class="quran-text">${r.clean_text || '—'} (${r.ayah})</span>
                            </div>

                            <!-- Navigation Bar & Related Switch -->
                            <div class="d-flex justify-content-between align-items-center bg-light border rounded p-2 mb-3 flex-wrap">
                                <button class="btn btn-outline-primary btn-sm nav-arrow-btn" 
                                        title="الآية السابقة"
                                        onclick="navigateAyah(${r.surah}, ${r.ayah - 1}, ${r.surah}, ${r.ayah})">
                                    →
                                </button>
                                <div class="text-center px-2">
                                    <span class="fw-bold text-secondary small">التصفح: </span>
                                    <span class="quran-text px-2">${r.full_text} (${r.ayah})</span>
                                </div>
                                <button class="btn btn-outline-primary btn-sm nav-arrow-btn" 
                                        title="الآية التالية"
                                        onclick="navigateAyah(${r.surah}, ${r.ayah + 1}, ${r.surah}, ${r.ayah})">
                                    ←
                                </button>
                                <div class="w-100 border-top mt-2 pt-2 d-flex justify-content-center">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="rel-check-${r.surah}-${r.ayah}" 
                                               ${r.is_related_to_prev ? 'checked' : ''} 
                                               onchange="toggleRelation(${r.surah}, ${r.ayah}, this.checked)">
                                        <label class="form-check-label fw-bold text-dark" for="rel-check-${r.surah}-${r.ayah}">
                                            مرتبطة بالآية السابقة (${r.ayah - 1})
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Topic Tags -->
                            <div class="mb-3 p-2 bg-light rounded border">
                                <small class="text-muted d-block mb-2 fw-bold">مواضيع الآية (انقر للربط/الإلغاء):</small>
                                <div class="d-flex flex-wrap align-items-center">
                                    ${topicTags}
                                </div>
                            </div>

                            <!-- Bi-directional Custom Links Section -->
                            <div class="mb-3 p-3 bg-info-subtle border border-info rounded">
                                <label class="fw-bold text-dark mb-2 d-block">🔗 الروابط المخصصة (تبادلية):</label>
                                <div id="custom-links-container-${r.surah}-${r.ayah}">
                                    ${customLinksHtml.length > 0 ? customLinksHtml : '<div class="text-muted small mb-2 no-links-placeholder">لا توجد روابط مخصصة لهذه الآية.</div>'}
                                </div>
                                <div class="row g-2 mt-2">
                                    <div class="col-md-3">
                                        <input type="number" class="form-control form-control-sm" id="link-target-surah-${r.surah}-${r.ayah}" placeholder="رقم السورة Target">
                                    </div>
                                    <div class="col-md-3">
                                        <input type="number" class="form-control form-control-sm" id="link-target-ayah-${r.surah}-${r.ayah}" placeholder="رقم الآية Target">
                                    </div>
                                    <div class="col-md-4">
                                        <input type="text" class="form-control form-control-sm" id="link-comment-${r.surah}-${r.ayah}" placeholder="ملاحظة أو سبب الربط (اختياري)">
                                    </div>
                                    <div class="col-md-2">
                                        <button class="btn btn-info btn-sm w-100 text-white fw-bold" onclick="addCustomLink(${r.surah}, ${r.ayah})">إضافة رابط</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Multiple Notes Row -->
                            <div class="mb-3 p-3 bg-light rounded border">
                                <label class="fw-bold text-secondary mb-2 d-block">📝 الملاحظات الخاصة بالآية:</label>
                                <ul class="list-group mb-2" id="notes-list-${r.surah}-${r.ayah}">
                                    ${notesList.length > 0 ? notesList : '<li class="list-group-item text-muted small no-notes-placeholder">لا توجد ملاحظات لهذه الآية بعد.</li>'}
                                </ul>
                                <div class="input-group">
                                    <textarea class="form-control" id="note-input-${r.surah}-${r.ayah}" rows="2" placeholder="أضف ملاحظة طويلة أو تعليقًا جديدًا..."></textarea>
                                    <button class="btn btn-success" onclick="addNote(${r.surah}, ${r.ayah})">إضافة ملاحظة</button>
                                </div>
                            </div>

                            <!-- Connected Related Ayahs Block -->
                            ${(r.related_ayahs && r.related_ayahs.length > 0) ? `
                                <div class="mb-3 p-3 bg-warning-subtle border border-warning rounded">
                                    <label class="fw-bold text-dark mb-2 d-block">🔗 الآيات المتتابعة المباشرة:</label>
                                    <div>
                                        ${relatedAyahsHtml}
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Words Table -->
                            <div class="table-responsive">
                                <table class="table table-sm table-bordered align-middle text-center mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th style="width: 50px;">#</th>
                                            <th>الكلمة</th>
                                            <th>الجذر / المصدر</th>
                                            <th>الوزن</th>
                                            <th>المعنى</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${rows}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </details>
                </div>
            `;
        }

        async function addCustomLink(surah, ayah) {
            const targetSurah = document.getElementById(`link-target-surah-${surah}-${ayah}`).value;
            const targetAyah = document.getElementById(`link-target-ayah-${surah}-${ayah}`).value;
            const comment = document.getElementById(`link-comment-${surah}-${ayah}`).value.trim();

            if (!targetSurah || !targetAyah) {
                alert('يرجى إدخال رقم السورة ورقم الآية المستهدفة.');
                return;
            }

            const card = document.getElementById(`ayah-card-${surah}-${ayah}`);
            const wasOpen = card ? card.querySelector('details')?.open : false;

            const res = await fetch('/api/add_custom_link', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    source_surah: surah,
                    source_ayah: ayah,
                    target_surah: parseInt(targetSurah),
                    target_ayah: parseInt(targetAyah),
                    link_comment: comment
                })
            });

            if (res.ok) {
                const resData = await res.json();
                if (resData.data) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = renderAyahCard(resData.data);
                    if (wasOpen) tempDiv.querySelector('details').open = true;
                    card.replaceWith(tempDiv.firstElementChild);
                }
            } else {
                alert('حدث خطأ أثناء إضافة الرابط. تأكد من صحة الآية المستهدفة.');
            }
        }

        async function deleteCustomLink(linkId, currentSurah, currentAyah) {
            if (!confirm('هل أنت تأكد من حذف هذا الرابط؟')) return;

            const card = document.getElementById(`ayah-card-${currentSurah}-${currentAyah}`);
            const wasOpen = card ? card.querySelector('details')?.open : false;

            const res = await fetch('/api/delete_custom_link', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ link_id: linkId, current_surah: currentSurah, current_ayah: currentAyah })
            });

            if (res.ok) {
                const resData = await res.json();
                if (resData.data) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = renderAyahCard(resData.data);
                    if (wasOpen) tempDiv.querySelector('details').open = true;
                    card.replaceWith(tempDiv.firstElementChild);
                }
            }
        }

        async function toggleRelation(surah, ayah, isRelated) {
            const card = document.getElementById(`ayah-card-${surah}-${ayah}`);
            const wasOpen = card ? card.querySelector('details')?.open : false;
            const res = await fetch('/api/toggle_ayah_relation', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ surah, ayah, is_related: isRelated })
            });

            if (res.ok) {
                const resData = await res.json();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = renderAyahCard(resData.data);
                if (wasOpen) tempDiv.querySelector('details').open = true;
                card.replaceWith(tempDiv.firstElementChild);
            }
        }

        async function addNote(surah, ayah) {
            const textarea = document.getElementById(`note-input-${surah}-${ayah}`);
            const text = textarea.value.trim();
            if (!text) return;

            const res = await fetch('/api/add_ayah_note', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ surah, ayah, note_text: text })
            });

            if (res.ok) {
                const data = await res.json();
                textarea.value = '';

                const notesList = document.getElementById(`notes-list-${surah}-${ayah}`);
                const placeholder = notesList.querySelector('.no-notes-placeholder');
                if (placeholder) placeholder.remove();

                const newLi = document.createElement('li');
                newLi.className = 'list-group-item d-flex justify-content-between align-items-start bg-white';
                newLi.id = `note-item-${data.id}`;
                newLi.innerHTML = `
                    <div class="note-item me-2 text-wrap">${data.note_text}</div>
                    <button class="btn btn-sm btn-outline-danger py-0 px-2 ms-2" onclick="deleteNote(${data.id})">حذف</button>
                `;
                notesList.appendChild(newLi);
            }
        }

        async function deleteNote(noteId) {
            if (!confirm('هل أنت تأكد من حذف هذه الملاحظة؟')) return;

            const res = await fetch('/api/delete_ayah_note', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: noteId })
            });

            if (res.ok) {
                const elem = document.getElementById(`note-item-${noteId}`);
                if (elem) elem.remove();
            }
        }

        async function navigateAyah(targetSurah, targetAyah, currentSurah, currentAyah) {
            if (targetAyah < 1) return;
            const currentCard = document.getElementById(`ayah-card-${currentSurah}-${currentAyah}`);
            const wasOpen = currentCard ? currentCard.querySelector('details')?.open : false;

            const res = await fetch(`/api/ayah?surah=${targetSurah}&ayah=${targetAyah}`);
            if (!res.ok) {
                alert('لا توجد آية بهذا الرقم في هذه السورة.');
                return;
            }

            const data = await res.json();
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = renderAyahCard(data);
            if (wasOpen) tempDiv.querySelector('details').open = true;
            currentCard.replaceWith(tempDiv.firstElementChild);
        }

        async function toggleAyahTopic(surah, ayah, topicId, element) {
            element.classList.toggle('active');
            element.classList.toggle('inactive');

            const card = document.getElementById(`ayah-card-${surah}-${ayah}`);
            const activeTags = card.querySelectorAll('.topic-tag.active');
            const topic_ids = Array.from(activeTags).map(tag => parseInt(tag.getAttribute('data-topic-id')));

            const res = await fetch('/api/update_ayah_topics', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ surah, ayah, topic_ids })
            });

            if (res.ok) {
                const resData = await res.json();
                if (resData.data) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = renderAyahCard(resData.data);
                    card.replaceWith(tempDiv.firstElementChild);
                }
            }
        }

        async function updateWordField(id, field, elem) {
            const value = elem.innerText.trim();
            await fetch('/api/update_word', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, field, value })
            });
        }
    </script>
</body>
</html>
