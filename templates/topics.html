<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المواضيع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Fix RTL input-group border radiuses for topic input */
        .topic-group-rtl .form-control {
            border-top-left-radius: 0 !important;
            border-bottom-left-radius: 0 !important;
            border-top-right-radius: 0.375rem !important;
            border-bottom-right-radius: 0.375rem !important;
        }

        .topic-group-rtl .btn {
            border-top-right-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
            border-top-left-radius: 0.375rem !important;
            border-bottom-left-radius: 0.375rem !important;
        }
    </style>
</head>
<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>إدارة المواضيع القرآنيّة</h2>
        <a href="/" class="btn btn-outline-primary">العودة للبحث 🔍</a>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">إضافة موضوع جديد</h5>
                </div>
                <div class="card-body">
                    <div class="input-group topic-group-rtl">
                        <input type="text" id="new-topic-name" class="form-control" placeholder="اسم الموضوع..." onkeydown="if(event.key === 'Enter') addTopic()">
                        <button class="btn btn-success px-4" onclick="addTopic()">إضافة</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">المواضيع المسجلة</h5>
                </div>
                <div class="card-body">
                    <div id="topics-list" class="d-flex flex-wrap gap-2">
                        <!-- Topics rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadTopics);

        async function loadTopics() {
            const res = await fetch('/api/topics');
            const topics = await res.json();
            
            const listDiv = document.getElementById('topics-list');
            if (topics.length === 0) {
                listDiv.innerHTML = '<span class="text-muted">لا توجد مواضيع مضافة.</span>';
                return;
            }

            listDiv.innerHTML = topics.map(t => `
                <span class="badge bg-secondary p-2 fs-6">${t.name}</span>
            `).join('');
        }

        async function addTopic() {
            const input = document.getElementById('new-topic-name');
            const name = input.value.trim();
            if(!name) return;

            const res = await fetch('/api/add_topic', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name })
            });

            if(res.ok) {
                input.value = '';
                loadTopics();
            } else {
                alert('حدث خطأ أو أن الموضوع موجود بالفعل');
            }
        }
    </script>
</body>
</html>
