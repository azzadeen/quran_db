<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المواضيع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        .topic-group-rtl .form-control {
            border-top-left-radius: 0 !important;
            border-bottom-left-radius: 0 !important;
            border-top-right-radius: 0.375rem !important;
            border-bottom-right-radius: 0.375rem !important;
        }

        .topic-group-rtl .btn {
            border-top-right-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
            border-top-left-radius: 0.375rem !important;
            border-bottom-left-radius: 0.375rem !important;
        }

        .topic-badge-clickable {
            cursor: pointer;
            transition: transform 0.15s ease-in-out, opacity 0.15s;
        }

        .topic-badge-clickable:hover {
            opacity: 0.85;
            transform: scale(1.03);
        }
    </style>
</head>
<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>إدارة المواضيع القرآنيّة</h2>
        <a href="/" class="btn btn-outline-primary">العودة للبحث 🔍</a>
    </div>

    <div class="row">
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">إضافة موضوع جديد</h5>
                </div>
                <div class="card-body">
                    <div class="input-group topic-group-rtl">
                        <input type="text" id="new-topic-name" class="form-control" placeholder="اسم الموضوع..." onkeydown="if(event.key === 'Enter') addTopic()">
                        <button class="btn btn-success px-4" onclick="addTopic()">إضافة</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">المواضيع المسجلة</h5>
                </div>
                <div class="card-body">
                    <div id="topics-list" class="list-group">
                        <!-- Topics rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadTopics);

        async function loadTopics() {
            const res = await fetch('/api/topics');
            const topics = await res.json();
            
            const listDiv = document.getElementById('topics-list');
            if (topics.length === 0) {
                listDiv.innerHTML = '<span class="text-muted p-2">لا توجد مواضيع مضافة.</span>';
                return;
            }

            listDiv.innerHTML = topics.map(t => `
                <div class="list-group-item d-flex justify-content-between align-items-center bg-white" id="topic-item-${t.id}">
                    <a href="/?column=topic&query=${encodeURIComponent(t.name)}" 
                       class="badge bg-primary fs-6 text-decoration-none topic-badge-clickable py-2 px-3"
                       title="اضغط للبحث عن الآيات المتعلقة بهذا الموضوع">
                        🔍 ${t.name}
                    </a>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-secondary" onclick="editTopic(${t.id}, '${t.name.replace(/'/g, "\\'")}')">تعديل</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteTopic(${t.id}, '${t.name.replace(/'/g, "\\'")}')">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        async function addTopic() {
            const input = document.getElementById('new-topic-name');
            const name = input.value.trim();
            if(!name) return;

            const res = await fetch('/api/add_topic', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name })
            });

            if(res.ok) {
                input.value = '';
                loadTopics();
            } else {
                const err = await res.json();
                alert(err.error || 'حدث خطأ أو أن الموضوع موجود بالفعل');
            }
        }

        async function editTopic(id, currentName) {
            const newName = prompt('تعديل اسم الموضوع:', currentName);
            if (!newName || newName.trim() === '' || newName.trim() === currentName) return;

            const res = await fetch('/api/update_topic', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, name: newName.trim() })
            });

            if (res.ok) {
                loadTopics();
            } else {
                const err = await res.json();
                alert(err.error || 'فشل التعديل. قد يكون الاسم مكررًا.');
            }
        }

        async function deleteTopic(id, topicName) {
            if (!confirm(`هل أنت تأكد من حذف الموضوع "${topicName}"؟\nسيتأثر جميع الآيات المربوطة بهذا الموضوع وسوف يتم فك الارتباط تلقائيًا.`)) return;

            const res = await fetch('/api/delete_topic', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id })
            });

            if (res.ok) {
                loadTopics();
            } else {
                alert('حدث خطأ أثناء حذف الموضوع.');
            }
        }
    </script>
</body>
</html>
